# The single entry point of the web app. Only /api is forwarded to the backend; /internal (where the engine
# posts events and heartbeats) is never reachable from here, the engine talks to the backend directly.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    server_name _;

    location /api/ {
        # Docker's DNS, asked again every 10 s: when the backend container is recreated (new address) or
        # not up yet, nginx finds it again instead of keeping the address it saw at start-up.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # the WebSocket at /api/ws
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
    }

    location /internal/ {
        return 404;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
