%YAML:1.0
# NvDCF tracker settings for nvtracker (ROADMAP Phase 1.3), passed with --tracker-config.
# Written for this project; the values are a starting point for people walking in a room, not tuned
# numbers. Check the effect with the "tracks" / "short_tracks" figures ds_engine prints at the end.

BaseConfig:
  # detections below this score are ignored (nvinfer already drops those under 0.25)
  minDetectorConfidence: 0.25

TargetManagement:
  enableBboxUnClipping: 1
  maxTargetsPerStream: 150
  # a new detection that overlaps an existing target by more than this IoU is not a new target
  minIouDiff4NewTarget: 0.5
  # below this tracker confidence a target is kept alive in "shadow" mode (no detection matched)
  minTrackerConfidence: 0.4
  # frames a new target must survive before it gets an ID that is reported
  probationAge: 3
  # frames a target may stay in shadow mode before it is dropped (1 s at 30 fps)
  maxShadowTrackingAge: 30
  earlyTerminationAge: 1

TrajectoryManagement:
  # 0: 32-bit IDs counted per stream, 1: 64-bit unique IDs
  useUniqueID: 0

DataAssociator:
  dataAssociatorType: 0
  # 0: greedy, 1: cascaded
  associationMatcherType: 1
  checkClassMatch: 1
  minMatchingScore4Overall: 0.4
  minMatchingScore4SizeSimilarity: 0.35
  minMatchingScore4Iou: 0.25
  minMatchingScore4VisualSimilarity: 0.5
  matchingScoreWeight4VisualSimilarity: 0.35
  matchingScoreWeight4SizeSimilarity: 0.4
  matchingScoreWeight4Iou: 0.35
  # detections between minDetectorConfidence and this value are matched by IoU only
  tentativeDetectorConfidence: 0.3
  minMatchingScore4TentativeIou: 0.5

StateEstimator:
  # 0: none, 1: simple (constant-velocity Kalman filter), 2: regular
  stateEstimatorType: 1
  processNoiseVar4Loc: 2.0
  processNoiseVar4Size: 1.0
  processNoiseVar4Vel: 0.1
  measurementNoiseVar4Detector: 4.0
  measurementNoiseVar4Tracker: 16.0

VisualTracker:
  # 0: none, 1: NvDCF (discriminative correlation filter)
  visualTrackerType: 1
  useColorNames: 1
  useHog: 0
  featureImgSizeLevel: 2
  featureFocusOffsetFactor_y: -0.2
  filterLr: 0.075
  filterChannelWeightsLr: 0.1
  gaussianSigma: 0.75
